name: Deploy Frontend to CloudFront

on:
  push:
    branches:
      - main
      - homologation
      - develop
      - feature/frontGateway
  pull_request:
    branches:
      - main
      - homologation
      - develop

env:
  AWS_REGION: us-east-2
  PROJECT_NAME: ia-arch-analyzer
  APP_NAME: secure-systems

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "BUCKET_SUFFIX=production" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/homologation" ]]; then
            echo "environment=homologation" >> $GITHUB_OUTPUT
            echo "BUCKET_SUFFIX=homologation" >> $GITHUB_ENV
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "BUCKET_SUFFIX=dev" >> $GITHUB_ENV
          fi

      - name: Terraform plan/apply
        id: terraform
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=tf-state-ai-architecture-analyzer" \
            -backend-config="key=v1/frontend/${{ steps.env.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -upgrade

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running terraform plan for PR..."
            terraform plan \
              -var-file="envs/${{ steps.env.outputs.environment }}/terraform.tfvars"
          else
            echo "Running terraform apply for push..."
            terraform apply -auto-approve \
              -var-file="envs/${{ steps.env.outputs.environment }}/terraform.tfvars"
          fi

          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          GATEWAY_API_BASE_URL=$(terraform output -raw gateway_api_base_url)

          echo "s3_bucket=${S3_BUCKET}" >> $GITHUB_OUTPUT
          echo "distribution_id=${DISTRIBUTION_ID}" >> $GITHUB_OUTPUT
          echo "gateway_api_base_url=${GATEWAY_API_BASE_URL}" >> $GITHUB_OUTPUT
          cd ..

      - name: Build application
        if: github.event_name != 'pull_request'
        env:
          VITE_API_URL: ${{ steps.terraform.outputs.gateway_api_base_url }}
          VITE_REPORT_API_URL: ${{ steps.terraform.outputs.gateway_api_base_url }}
        run: npm run build

      - name: Upload to S3
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/ \
            s3://${{ steps.terraform.outputs.s3_bucket }}/ \
            --delete \
            --cache-control "public, max-age=3600" \
            --metadata "deployment-time=$(date -u +'%Y-%m-%dT%H:%M:%SZ'),git-commit=${GITHUB_SHA:0:7}"

      - name: Verify uploaded files
        if: github.event_name != 'pull_request'
        run: |
          aws s3 ls s3://${{ steps.terraform.outputs.s3_bucket }}/ --recursive | sort | tail -20

      - name: Invalidate CloudFront cache
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform.outputs.distribution_id }} \
            --paths "/*"
